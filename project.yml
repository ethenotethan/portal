name: Portal
options:
  bundleIdPrefix: com.ethenotethan
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: "4.6.0"
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: "2.3.0"
  BeautifulMermaid:
    url: https://github.com/lukilabs/beautiful-mermaid-swift
    from: "1.0.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.3"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.7.0"

targets:
  Portal-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/Portal
      - path: App/MacApp.swift
    dependencies:
      - package: Lottie
      - package: Highlightr
      - package: BeautifulMermaid
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: SwiftMath
    entitlements:
      path: Portal-macOS.entitlements
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethenotethan.Portal.macOS
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Portal-macOS/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  Portal-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Portal
      - path: App/IOSApp.swift
    dependencies:
      - package: Lottie
      - package: Highlightr
      - package: BeautifulMermaid
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: SwiftMath
    entitlements:
      path: Portal-iOS.entitlements
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethenotethan.Portal.iOS
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Portal-iOS/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  PortalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/PortalUITests
    dependencies:
      - target: Portal-iOS
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

  # macOS UI tests — the beachball gate lives here. Every main-thread hang this
  # app has hit was on macOS (the platform with MLX, GraphMouseInterceptor, the
  # overlay-nav surface). Launched with --hang-fatal, the MainThreadWatchdog
  # trips an assertion on any >250ms main-thread stall → the test fails → the
  # PR can't merge. That's the "can't ship a beachball" gate.
  PortalMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/PortalMacUITests
    dependencies:
      - target: Portal-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethenotethan.Portal.macOS.uitests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
