name: TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight?"
        required: false
        default: "true"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Archive & Upload to TestFlight
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ── Signing ──────────────────────────────────────────────────────
      - name: Install Apple Distribution Certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          # Create a dedicated keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"

          # Import the P12 — don't use -t cert, let pkcs12 handle both key+cert
          P12_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 -d > "$P12_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k actions "$KEYCHAIN_PATH"

          # Add to search list and set as default
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          # Verify cert is visible
          echo "=== Identities in keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "=== All identities ==="
          security find-identity -v "$KEYCHAIN_PATH"

          rm -f "$P12_PATH"

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | \
            base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/AppStore.mobileprovision
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
            <<< "$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/AppStore.mobileprovision)")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      # ── Archive ──────────────────────────────────────────────────────
      - name: Archive iOS App
        run: |
          mkdir -p build
          xcodebuild archive \
            -project HermesNative.xcodeproj \
            -scheme HermesNative-iOS \
            -destination "generic/platform=iOS" \
            -archivePath build/HermesNative.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_UUID }}" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}"

      # ── Export ────────────────────────────────────────────────────────
      - name: Create ExportOptions.plist
        run: |
          cat > build/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.researchoors.HermesNative.iOS</key>
              <string>${{ env.PROFILE_UUID }}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/HermesNative.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      # ── Upload ────────────────────────────────────────────────────────
      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > \
            ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun altool --upload-app \
            -t ios \
            -f build/export/HermesNative.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      # ── Artifact ─────────────────────────────────────────────────────
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesNative.ipa
          path: build/export/HermesNative.ipa
          retention-days: 30

  # ── macOS Notarized Build ────────────────────────────────────────────
  notarize-macos:
    name: Notarize macOS App
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Apple Distribution Certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"

          P12_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 -d > "$P12_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k actions "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          echo "=== Identities in keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "=== All identities ==="
          security find-identity -v "$KEYCHAIN_PATH"

          rm -f "$P12_PATH"

      - name: Archive macOS App
        run: |
          mkdir -p build
          xcodebuild archive \
            -project HermesNative.xcodeproj \
            -scheme HermesNative-macOS \
            -destination "generic/platform=macOS" \
            -archivePath build/HermesNative-macOS.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}"

      - name: Export macOS App
        run: |
          cat > build/ExportOptions-macOS.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/HermesNative-macOS.xcarchive \
            -exportPath build/export-macos \
            -exportOptionsPlist build/ExportOptions-macOS.plist

      - name: Notarize
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          ditto -c -k --keepParent \
            build/export-macos/HermesNative-macOS.app \
            build/HermesNative-macOS.zip

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > \
            ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun notarytool submit build/HermesNative-macOS.zip \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

          xcrun stapler staple build/export-macOS/HermesNative-macOS.app

      - name: Upload macOS App as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesNative-macOS.app
          path: build/export-macOS/HermesNative-macOS.app
          retention-days: 30
