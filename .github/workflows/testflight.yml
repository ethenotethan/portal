name: TestFlight

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight?"
        required: false
        default: "true"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Archive & Upload to TestFlight
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ── Signing ──────────────────────────────────────────────────────
      - name: Install Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      - name: Install Provisioning Profile & Verify Signing
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | \
            base64 -d > "$PP_DIR/AppStore.mobileprovision"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
            <<< "$(security cms -D -i "$PP_DIR/AppStore.mobileprovision")")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          mv "$PP_DIR/AppStore.mobileprovision" "$PP_DIR/$PROFILE_UUID.mobileprovision"

          echo "=== Keychain search list ==="
          security list-keychains -d user
          echo "=== Codesigning identities (all keychains) ==="
          security find-identity -v -p codesigning
          echo "=== Codesigning identities (signing_temp only) ==="
          security find-identity -v -p codesigning ~/Library/Keychains/signing_temp.keychain-db

      # ── Archive ──────────────────────────────────────────────────────
      - name: Generate CI signing xcconfig (SPM deps need this)
        run: |
          cat > .github/ci-signing.xcconfig << 'EOF'
          DEVELOPMENT_TEAM = ${{ secrets.TEAM_ID }}
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF

      - name: Clear SwiftPM Artifact Cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

      - name: Patch pbxproj with provisioning profile (app target only)
        run: |
          # Target-scoped PROVISIONING_PROFILE_SPECIFIER is silently ignored by
          # xcodebuild. Instead, patch the xcodegen-generated pbxproj directly
          # so the setting only applies to Portal-iOS, not SPM deps.
          python3 - "${{ env.PROFILE_UUID }}" << 'PYEOF'
          import sys, plistlib, os

          UUID = sys.argv[1]
          pbxproj = "Portal.xcodeproj/project.pbxproj"

          # Read the pbxproj (it's a plist-in-text format, not standard plist)
          with open(pbxproj) as f:
              data = f.read()

          # Find the Portal-iOS native target section and its build config list
          import re

          # Find the target's buildConfigurationList ID
          # The native target section looks like:
          # /* Begin PBXNativeTarget section */
          #   A1B2C3D4 /* Portal-iOS */ = { ... buildConfigurationList = XYZ /* Build configuration list for PBXNativeTarget "Portal-iOS" */ ... };
          target_match = re.search(
              r'/\* Portal-iOS \*/.*?buildConfigurationList = ([A-F0-9]+) ',
              data,
              re.DOTALL
          )
          if not target_match:
              print("ERROR: Could not find Portal-iOS target")
              print("Available targets:")
              for m in re.finditer(r'/\* (\w[^\*]+) \*/.*?buildConfigurationList', data):
                  print(f"  {m.group(1)}")
              sys.exit(1)

          config_list_id = target_match.group(1)
          print(f"Found buildConfigurationList ID: {config_list_id}")

          # Find the XCConfigurationList section and the Release config
          # XCConfigurationList looks like:
          #   XYZ /* Build configuration list for ... */ = { ... buildConfigurations = ( ABC /* Release */, DEF /* Debug */ ); ... };
          list_match = re.search(
              rf'{config_list_id} /\*.*?\*/ = \{{.*?buildConfigurations = \(\s*([^)]+)\)',
              data,
              re.DOTALL
          )
          if not list_match:
              print(f"ERROR: Could not find configuration list {config_list_id}")
              sys.exit(1)

          config_ids_str = list_match.group(1)
          # Parse IDs: "ABC /* Release */, DEF /* Debug */"
          config_refs = re.findall(r'([A-F0-9]+) /\* (\w+) \*/', config_ids_str)
          print(f"Build configurations: {config_refs}")

          release_id = None
          for cid, cname in config_refs:
              if cname == 'Release':
                  release_id = cid
                  break

          if not release_id:
              print("ERROR: Could not find Release configuration")
              sys.exit(1)

          print(f"Found Release config ID: {release_id}")

          # Find the XCBuildConfiguration section entry for this Release config
          #   XYZ /* Release */ = { ... buildSettings = { ... }; ... };
          config_match = re.search(
              rf'{release_id} /\* Release \*/ = \{{.*?buildSettings = \{{(.*?)\}}',
              data,
              re.DOTALL
          )
          if not config_match:
              print(f"ERROR: Could not find build settings for Release config {release_id}")
              sys.exit(1)

          build_settings_block = config_match.group(1)
          print(f"Current build settings (first 200 chars): {build_settings_block[:200]}")

          # Add PROVISIONING_PROFILE_SPECIFIER and ensure CODE_SIGN_STYLE is Manual
          # The build settings block format: key = value; (one per line)
          new_settings = build_settings_block

          # Replace or add CODE_SIGN_STYLE
          if 'CODE_SIGN_STYLE' in new_settings:
              new_settings = re.sub(
                  r'CODE_SIGN_STYLE = [^;]+;',
                  'CODE_SIGN_STYLE = Manual;',
                  new_settings
              )
          else:
              new_settings += '\n\t\t\t\tCODE_SIGN_STYLE = Manual;'

          # Replace or add PROVISIONING_PROFILE_SPECIFIER
          if 'PROVISIONING_PROFILE_SPECIFIER' in new_settings:
              new_settings = re.sub(
                  r'PROVISIONING_PROFILE_SPECIFIER = [^;]+;',
                  f'PROVISIONING_PROFILE_SPECIFIER = {UUID};',
                  new_settings
              )
          else:
              new_settings += f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = {UUID};'

          # Apply the replacement back to the full data
          data = data.replace(build_settings_block, new_settings)

          with open(pbxproj, 'w') as f:
              f.write(data)

          print(f"Patched pbxproj: set PROVISIONING_PROFILE_SPECIFIER={UUID} on Portal-iOS Release")
          PYEOF

      - name: Archive iOS App
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Portal.xcodeproj \
            -scheme Portal-iOS \
            -destination "generic/platform=iOS" \
            -archivePath build/Portal.xcarchive \
            -xcconfig .github/ci-signing.xcconfig \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain=$HOME/Library/Keychains/signing_temp.keychain-db"

      # ── Export ────────────────────────────────────────────────────────
      - name: Create ExportOptions.plist
        run: |
          cat > build/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ethenotethan.Portal.iOS</key>
              <string>${{ env.PROFILE_UUID }}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Portal.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      # ── Upload ────────────────────────────────────────────────────────
      - name: Find Current TestFlight Build
        if: ${{ github.event.inputs.upload != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: com.ethenotethan.Portal.iOS
        run: |
          CURRENT_BUILD=$(ruby .github/scripts/distribute_testflight.rb --print-latest-build)
          echo "PREVIOUS_BUILD_NUMBER=$CURRENT_BUILD" >> "$GITHUB_ENV"
          echo "Current latest build before upload: ${CURRENT_BUILD:-none}"

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > \
            ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun altool --upload-app \
            -t ios \
            -f build/export/Portal-iOS.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Assign Build to TestFlight Groups
        if: ${{ github.event.inputs.upload != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: com.ethenotethan.Portal.iOS
          APP_VERSION: "1.0"
          PREVIOUS_BUILD_NUMBER: ${{ env.PREVIOUS_BUILD_NUMBER }}
          WHAT_TO_TEST: "Portal CI build from ${{ github.sha }}."
          MAX_WAIT_SECONDS: "900"
          POLL_SECONDS: "30"
        run: ruby .github/scripts/distribute_testflight.rb

      # ── Artifact ─────────────────────────────────────────────────────
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portal-iOS.ipa
          path: build/export/Portal-iOS.ipa
          retention-days: 30

  # ── macOS Notarized Build (needs Developer ID cert, disabled for now) ──
  notarize-macos:
    name: Notarize macOS App
    runs-on: macos-26
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      - name: Archive macOS App
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Portal.xcodeproj \
            -scheme Portal-macOS \
            -destination "generic/platform=macOS" \
            -archivePath build/Portal-macOS.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain=$HOME/Library/Keychains/signing_temp.keychain-db"

      - name: Export macOS App
        run: |
          cat > build/ExportOptions-macOS.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/Portal-macOS.xcarchive \
            -exportPath build/export-macos \
            -exportOptionsPlist build/ExportOptions-macOS.plist

      - name: Notarize
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          ditto -c -k --keepParent \
            build/export-macos/Portal-macOS.app \
            build/Portal-macOS.zip

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > \
            ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun notarytool submit build/Portal-macOS.zip \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

          xcrun stapler staple build/export-macOS/Portal-macOS.app

      - name: Upload macOS App as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portal-macOS.app
          path: build/export-macOS/Portal-macOS.app
          retention-days: 30
