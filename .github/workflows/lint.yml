name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        # PINNED to an exact version. `brew install swiftlint` grabs the latest
        # formula, and a newer SwiftLint detects MORE violations than the one
        # the baseline was generated with — so an unpinned bump makes CI fail on
        # violations that aren't in .swiftlint-baseline (the 0.63→0.65 drift that
        # broke #222). The baseline only matches the version that wrote it, so
        # the CI version and the version behind `make lint-baseline` must agree.
        # Bumping: change SWIFTLINT_VERSION here, `brew install swiftlint` (or
        # download the same tag) locally, run `make lint-baseline`, commit both.
        env:
          SWIFTLINT_VERSION: 0.65.0
        run: |
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o swiftlint.zip -d "$HOME/swiftlint-bin"
          echo "$HOME/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Verify SwiftLint version
        run: swiftlint version

      - name: Run SwiftLint
        # --baseline freezes pre-existing violations (.swiftlint-baseline) so
        # only NEWLY introduced ones fail. Regenerate the baseline locally with
        # `make lint-baseline` and only ever to REMOVE entries (paying down
        # debt), never to silence a new violation.
        run: swiftlint lint --strict --baseline .swiftlint-baseline --reporter github-actions-logging

  baseline-growth:
    name: Baseline growth guard
    runs-on: ubuntu-latest
    steps:
      # Full history so `git show <base>:.swiftlint-baseline` can read the
      # baseline as it exists on the target branch (default checkout is shallow
      # and wouldn't have the base ref).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the lint baseline did not grow
        # The baseline freezes PRE-EXISTING lint debt. This guard fails the PR
        # if any rule's frozen-entry count grew versus the base branch — i.e.
        # someone regenerated the baseline to silence a NEW violation instead of
        # fixing it, which would defeat every rule we enforce. Paying debt down
        # (counts shrink) always passes. See docs/architecture-rules.md.
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref || github.ref_name }}"
          python3 scripts/check-baseline-growth.py "$BASE"

  swift-build:
    name: Swift Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

  metric-ratchet:
    name: Metric ratchet
    runs-on: macos-26
    steps:
      # Full history so `git show <base>:metrics-baseline.json` and the
      # base...HEAD diff (patch check) resolve; default checkout is shallow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A clean build is mandatory: SwiftPM skips unchanged modules on an
      # incremental build and would under-count warnings, so this job always
      # compiles from scratch (no cache restore).
      - name: Build and capture warnings
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
          python3 scripts/collect-warnings.py build.log --root "$PWD" --json warnings.json

      # Coverage: run the package tests with instrumentation, then export the
      # full per-line report (no -summary-only — the patch check needs segments)
      # and reduce it to the testable-layer snapshot.
      - name: Test with coverage and capture snapshot
        run: |
          set -o pipefail
          swift test --enable-code-coverage 2>&1 | tail -5
          PROF=$(find .build -name '*.profdata' | head -1)
          BIN=$(find .build -name '*.xctest' -type d | head -1)
          EXE="$BIN/Contents/MacOS/$(basename "$BIN" .xctest)"
          xcrun llvm-cov export -instr-profile "$PROF" "$EXE" > cov-export.json
          python3 scripts/collect-coverage.py cov-export.json --root "$PWD" --json coverage.json

      - name: Ratchet metrics against the base branch
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref || github.ref_name }}"
          python3 scripts/check-metrics-ratchet.py \
            --warnings warnings.json --coverage coverage.json --base "$BASE"

      - name: Upload metric snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metric-snapshots
          path: |
            warnings.json
            coverage.json
            build.log
          if-no-files-found: ignore
          retention-days: 14
