name: Tests

# Everything that RUNS and can pass/fail on behavior, in one workflow so the PR
# checks list reads as one "Tests" group instead of four separate workflows.
# Each job is its own GitHub check (Tests / <name>) and they run in parallel —
# consolidation is organizational, not a serialization.
#
# This is the behavior half of CI. The posture half — floors that a committed
# baseline must not regress (Security, Warnings, Coverage, Performance, Quality)
# — lives in ratchet.yml. A test here asks "does it work?"; a ratchet there asks
# "did a tracked metric get worse?". SwiftLint's *run* is a test (it either
# passes clean or flags a new violation); the guard that its baseline can't be
# grown to silence one is a ratchet (Ratchet / Quality).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build (macOS + iOS) ─────────────────────────────────────────────────────
  # The compile gate: both platforms must build. A macOS-only local `swift
  # build` can pass while the iOS target fails (platform-specific availability,
  # asset catalogs), so CI builds Portal-iOS too. Ends with the offline
  # onboarding UI smoke test on a simulator.
  build:
    name: Build (macOS + iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iPhone simulator
        run: |
          # Runner images roll simulators forward (iPhone 16 -> 17 -> …); a
          # hardcoded name fails with "Unable to find a device matching the
          # destination". Resolve the newest available iPhone by UDID.
          SIM_ID=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9].*\([0-9A-F-]{36}\)' | grep -oE '[0-9A-F-]{36}' | tail -1)
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator found"; xcrun simctl list devices available; exit 1
          fi
          echo "Using simulator UDID: $SIM_ID"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

      - name: Build macOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project Portal.xcodeproj \
            -scheme Portal \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            2>&1 | tee build-macos.log | xcpretty

      - name: Build iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Portal.xcodeproj \
            -scheme Portal-iOS \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-ios-simulator.log | xcpretty

      - name: Run offline iOS Simulator UI smoke test
        run: |
          set -o pipefail
          RESULT_BUNDLE="${RUNNER_TEMP}/PortalOfflineUITests.xcresult"

          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b

          xcodebuild test \
            -project Portal.xcodeproj \
            -scheme Portal-iOS \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing:PortalUITests/PortalOfflineSmokeUITests/testOnboardingRendersWithoutGatewaySecrets \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | tee ios-ui-offline-smoke.log | xcpretty

      - name: Upload iOS UI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-smoke-artifacts
          path: |
            ${{ runner.temp }}/PortalOfflineUITests.xcresult
            ios-ui-offline-smoke.log
            build-ios-simulator.log
            build-macos.log
          if-no-files-found: ignore
          retention-days: 14

  # ── SwiftLint ───────────────────────────────────────────────────────────────
  # Strict lint gated on the frozen baseline: only NEWLY introduced violations
  # fail. The floor that the baseline can't be grown to silence one is a separate
  # ratchet (Ratchet / Quality in ratchet.yml).
  swift-lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        # PINNED to an exact version. `brew install swiftlint` grabs the latest
        # formula, and a newer SwiftLint detects MORE violations than the one
        # the baseline was generated with — so an unpinned bump makes CI fail on
        # violations that aren't in .swiftlint-baseline (the 0.63→0.65 drift that
        # broke #222). The baseline only matches the version that wrote it, so
        # the CI version and the version behind `make lint-baseline` must agree.
        # Bumping: change SWIFTLINT_VERSION here, `brew install swiftlint` (or
        # download the same tag) locally, run `make lint-baseline`, commit both.
        env:
          SWIFTLINT_VERSION: 0.65.0
        run: |
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o swiftlint.zip -d "$HOME/swiftlint-bin"
          echo "$HOME/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Verify SwiftLint version
        run: swiftlint version

      - name: Run SwiftLint
        # --baseline freezes pre-existing violations (.swiftlint-baseline) so
        # only NEWLY introduced ones fail. Regenerate the baseline locally with
        # `make lint-baseline` and only ever to REMOVE entries (paying down
        # debt), never to silence a new violation.
        run: swiftlint lint --strict --baseline .swiftlint-baseline --reporter github-actions-logging

  # ── Swift package tests ─────────────────────────────────────────────────────
  # The SwiftPM unit suite (swift-testing + XCTest), auto-discovered. Layer 1 of
  # the testing strategy (docs/testing-strategy.md).
  swift-test:
    name: Swift package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run Swift unit tests
        run: |
          set -o pipefail
          swift test --disable-sandbox 2>&1 | tee swift-test.log

      - name: Upload Swift test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: swift-test.log
          if-no-files-found: ignore
          retention-days: 14

  # ── iOS simulator smoke tests ───────────────────────────────────────────────
  # Hermetic offline + local-gateway smoke and E2E flows on a simulator, backed
  # by a local Hermes API server. Layer 3.
  ios-smoke:
    name: iOS simulator smoke tests
    runs-on: macos-15
    env:
      HERMES_CI_API_KEY: portal-ci-local-key
      HERMES_CI_PORT: "18642"
      HERMES_CI_URL: ws://127.0.0.1:18642/v1/ws

    steps:
      - name: Checkout Portal
        uses: actions/checkout@v4
        with:
          path: portal

      - name: Checkout Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent

      - name: Install build tools
        run: |
          brew install xcodegen

      - name: Set up Hermes Agent
        working-directory: hermes-agent
        run: |
          python3.11 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[messaging,cron]'

      - name: Start local Hermes API server
        working-directory: hermes-agent
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-ci-home
          API_SERVER_ENABLED: "true"
          API_SERVER_HOST: 127.0.0.1
          API_SERVER_PORT: ${{ env.HERMES_CI_PORT }}
          API_SERVER_KEY: ${{ env.HERMES_CI_API_KEY }}
          HERMES_QUIET: "1"
          HERMES_SKIP_MEMORY: "1"
          HERMES_DISABLE_MEMORY: "1"
          TERMINAL_CWD: ${{ github.workspace }}/portal
        run: |
          set -euo pipefail
          mkdir -p "$HERMES_HOME/logs"
          cat > "$HERMES_HOME/config.yaml" <<'YAML'
          model:
            provider: openai
            model: gpt-4o-mini
          platforms:
            api_server:
              enabled: true
              extra:
                host: 127.0.0.1
                port: 18642
                key: portal-ci-local-key
          agent:
            max_turns: 6
          memory:
            memory_enabled: false
            user_profile_enabled: false
          YAML

          . .venv/bin/activate
          python -m gateway.run > "$HERMES_HOME/logs/api-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hermes-api-server.pid"

          for i in {1..60}; do
            if curl -fsS -H "Authorization: Bearer $API_SERVER_KEY" "http://127.0.0.1:${API_SERVER_PORT}/health" >/dev/null; then
              echo "Hermes API server is healthy"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/hermes-api-server.pid")" 2>/dev/null; then
              echo "Hermes API server exited early"
              cat "$HERMES_HOME/logs/api-server.log"
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for Hermes API server"
          cat "$HERMES_HOME/logs/api-server.log"
          exit 1

      - name: Generate Xcode project
        working-directory: portal
        run: xcodegen generate

      - name: Select an available iPhone simulator
        run: |
          # Runner images roll simulators forward (iPhone 16 -> 17 -> …); a
          # hardcoded name fails with "Unable to find a device matching the
          # destination". Resolve the newest available iPhone by UDID.
          SIM_ID=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9].*\([0-9A-F-]{36}\)' | grep -oE '[0-9A-F-]{36}' | tail -1)
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator found"; xcrun simctl list devices available; exit 1
          fi
          echo "Using simulator UDID: $SIM_ID"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

      - name: Build iOS Simulator app
        working-directory: portal
        run: |
          set -o pipefail
          xcodebuild build \
            -project Portal.xcodeproj \
            -scheme Portal-iOS \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build-ios-simulator.log" | xcpretty

      - name: Run offline onboarding smoke test
        working-directory: portal
        run: |
          set -o pipefail
          RESULT_BUNDLE="${RUNNER_TEMP}/PortalOfflineUITests.xcresult"

          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b

          xcodebuild test \
            -project Portal.xcodeproj \
            -scheme Portal-iOS \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing:PortalUITests/PortalOfflineSmokeUITests/testOnboardingRendersWithoutGatewaySecrets \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | tee "$RUNNER_TEMP/ios-ui-offline-smoke.log" | xcpretty

      - name: Run local-Hermes gateway smoke test
        if: always()
        working-directory: portal
        env:
          PORTAL_GATEWAY_URL: ${{ env.HERMES_CI_URL }}
          PORTAL_API_KEY: ${{ env.HERMES_CI_API_KEY }}
          API_SERVER_KEY: ${{ env.HERMES_CI_API_KEY }}
        run: |
          set -o pipefail
          RESULT_BUNDLE="${RUNNER_TEMP}/PortalLocalGatewayUITests.xcresult"

          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b

          xcodebuild test \
            -project Portal.xcodeproj \
            -scheme Portal-iOS \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing:PortalUITests/PortalGatewayConnectionUITests/testConnectsToLocalHermesGateway \
            -only-testing:PortalUITests/PortalGatewayConnectionUITests/testNewSessionPushesSingleChatDestination \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | tee "$RUNNER_TEMP/ios-ui-local-gateway-smoke.log" | xcpretty || true

      - name: Run E2E integration tests
        if: always()
        working-directory: portal
        env:
          PORTAL_GATEWAY_URL: ${{ env.HERMES_CI_URL }}
          PORTAL_API_KEY: ${{ env.HERMES_CI_API_KEY }}
          API_SERVER_KEY: ${{ env.HERMES_CI_API_KEY }}
        run: |
          set -o pipefail
          RESULT_BUNDLE="${RUNNER_TEMP}/PortalE2ETests.xcresult"

          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b

          xcodebuild test \
            -project Portal.xcodeproj \
            -scheme Portal-iOS \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing:PortalUITests/PortalE2ETests/testCoreChatFlow_SendPromptReceiveResponse \
            -only-testing:PortalUITests/PortalE2ETests/testCoreChatFlow_MultipleMessagesInSession \
            -only-testing:PortalUITests/PortalE2ETests/testSessionManagement_CreateAndNavigate \
            -only-testing:PortalUITests/PortalE2ETests/testSessionManagement_MultipleSessions \
            -only-testing:PortalUITests/PortalE2ETests/testAttachButtonVisibleWithoutCapabilityGating \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | tee "$RUNNER_TEMP/ios-e2e-tests.log" | xcpretty || true

      - name: Upload iOS simulator test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-artifacts
          path: |
            ${{ runner.temp }}/PortalOfflineUITests.xcresult
            ${{ runner.temp }}/PortalLocalGatewayUITests.xcresult
            ${{ runner.temp }}/PortalE2ETests.xcresult
            ${{ runner.temp }}/build-ios-simulator.log
            ${{ runner.temp }}/ios-ui-offline-smoke.log
            ${{ runner.temp }}/ios-ui-local-gateway-smoke.log
            ${{ runner.temp }}/ios-e2e-tests.log
            ${{ runner.temp }}/hermes-ci-home/logs/api-server.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Hermes API server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hermes-api-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/hermes-api-server.pid")" 2>/dev/null || true
          fi

  # ── macOS main-thread hang gate ─────────────────────────────────────────────
  # The beachball gate. Launches the macOS app under the MainThreadWatchdog with
  # --hang-fatal so any >250ms main-thread stall trips an assertion and fails the
  # test — before it can reach a user. Every hang this app has shipped was macOS,
  # so this runs on the platform that actually beachballs. Layer 4.
  hang-gate:
    name: macOS main-thread hang gate
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run macOS hang gate (--hang-fatal)
        run: |
          set -o pipefail
          RESULT_BUNDLE="${RUNNER_TEMP}/HangGate.xcresult"
          xcodebuild test \
            -project Portal.xcodeproj \
            -scheme Portal \
            -destination 'platform=macOS' \
            -only-testing:PortalMacUITests/MainThreadHangGateUITests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | tee "${RUNNER_TEMP}/hang-gate.log" | xcpretty

      # Guard against a silent no-op: a UI-test target that never attaches would
      # "pass" with zero executed tests, gating nothing while looking green.
      # Assert the hang test actually RAN.
      - name: Assert the hang test actually executed
        if: always()
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/hang-gate.log"
          if ! grep -qE "Test Case .*MainThreadHangGateUITests.* (passed|started)" "$LOG"; then
            echo "::error::Hang-gate test did not execute — the UI-test runner never attached."
            echo "This gate is a no-op in that state; failing so it isn't silently green."
            echo "----- hang-gate.log tail -----"
            tail -60 "$LOG" || true
            exit 1
          fi
          echo "Hang-gate test executed."

      - name: Upload hang-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-hang-gate-artifacts
          path: |
            ${{ runner.temp }}/HangGate.xcresult
            ${{ runner.temp }}/hang-gate.log
          if-no-files-found: ignore
          retention-days: 14
